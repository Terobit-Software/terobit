[workspace]
resolver = "3"
members = [
    # binaries
    "bins/tbpk_generator",
    "bins/terobit_client",
    "bins/terobit_editor",
    "bins/terobit_server",

    # client crates
    "crates/client/client_consts",
    "crates/client/client_dev",

    # runtime crates
    "crates/runtime/runtime_animation",
    "crates/runtime/runtime_assets",
    "crates/runtime/runtime_audio",
    "crates/runtime/runtime_core",
    "crates/runtime/runtime_input",
    "crates/runtime/runtime_logging",
    "crates/runtime/runtime_picking",
    "crates/runtime/runtime_render",
    "crates/runtime/runtime_run_flags",
    "crates/runtime/runtime_sandbox",
    "crates/runtime/runtime_scene",
    "crates/runtime/runtime_ui",
    "crates/runtime/runtime_window",
    "crates/runtime/runtime_api",
    "crates/runtime/runtime_consts",

    # sdk
    "sdk/crates/terobit_v1",
    "sdk/crates/terobit_v1_abi",
    "sdk/crates/terobit_v1_macros",

    # examples
    "tests/examples/sdk/hello_world1",

    # tooling
    "xtask",
]

[workspace.package]
version = "0.1.0"
publish = false

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["debug"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
# pinned: the zstd version is part of manifest v1, see docs/formats/tbman/v1.md#compression
zstd = "=0.14.3"
# not used directly, pins the bundled libzstd that `zstd` builds
zstd-sys = { version = "=2.1.2", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0", default-features = false }
toml = "1.2.1"
cap-std = "4.0.3"
tracing-panic = "0.1.4"
clap = { version = "4.6.7", features = ["derive"] }
"serde_with" = "3.24.0"
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
snafu = "0.9.2"
wasmtime = "50.0.1"
syn = { version = "3.0.10", features = ["full"] }
quote = "1.0.47"
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }

# Internal crates
runtime_animation = { path = "crates/runtime/runtime_animation" }
runtime_audio = { path = "crates/runtime/runtime_audio" }
runtime_core = { path = "crates/runtime/runtime_core" }
runtime_input = { path = "crates/runtime/runtime_input" }
runtime_logging = { path = "crates/runtime/runtime_logging" }
runtime_picking = { path = "crates/runtime/runtime_picking" }
runtime_render = { path = "crates/runtime/runtime_render" }
runtime_scene = { path = "crates/runtime/runtime_scene" }
runtime_ui = { path = "crates/runtime/runtime_ui" }
runtime_window = { path = "crates/runtime/runtime_window" }
runtime_run_flags = { path = "crates/runtime/runtime_run_flags" }
runtime_assets = { path = "crates/runtime/runtime_assets" }
runtime_sandbox = { path = "crates/runtime/runtime_sandbox" }
runtime_consts = { path = "crates/runtime/runtime_consts" }
client_consts = { path = "crates/client/client_consts" }
client_dev = { path = "crates/client/client_dev" }
terobit_v1 = { path = "sdk/crates/terobit_v1" }
terobit_v1_macros = { path = "sdk/crates/terobit_v1_macros" }
terobit_v1_abi = { path = "sdk/crates/terobit_v1_abi" }

# Final release builds: slow to compile, maximum speed and minimum size.
# cargo build --release
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Development release builds: optimized, but compiles quickly and incrementally.
# cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
strip = false
debug = "line-tables-only"
panic = "unwind"

# Keep dev builds usable: optimize dependencies (bevy) but not our crates.
[profile.dev.package."*"]
opt-level = 3

# CI builds: fastest possible compile, runtime speed doesn't matter.
# Overrides the dev profile's opt-level=3 for dependencies and drops debuginfo,
# which otherwise bloats every bevy-linked test binary and fills the runner disk.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 0
