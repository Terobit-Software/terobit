[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
tobj = "4"
anyhow = "1"
wgpu = "29.0.3"
winit = "0.30.13"
pollster = "0.4.0"
rand = "0.10.1"
bytemuck = "1.25.0"
glam = "0.32.1"
nalgebra-glm = "0.20.0"
dhat = "0.3"
chrono = "0.4.44"
bevy_ecs = "0.18.1"
env_logger = "0.11.10"
rapier3d = {version = "0.32.0", features = ["parallel", "simd-stable"]}

[profile.dev.package.rapier3d]
opt-level = 3
 
[profile.release]
codegen-units = 1