name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # ubuntu runner for check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # installed needed deps, most for bevy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev
      # install rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # caching
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-on-failure: true
      # format check
      - run: cargo fmt --all --check
      # check code
      - run: cargo check --workspace --all-targets --profile ci

  test:
    # ubuntu runner for test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uninstall stuff that we dont use during ci because we need max space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # installed needed deps, most for bevy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev
      # install rust
      - uses: dtolnay/rust-toolchain@stable
      # cache
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      # install nextest
      - uses: taiki-e/install-action@nextest
      # nextest
      - run: cargo nextest run --workspace --no-tests=pass --no-fail-fast --cargo-profile ci
      # run nextest on client dev with dev feat enabled
      - run: cargo nextest run -p client_dev --features dev --no-fail-fast --cargo-profile ci
