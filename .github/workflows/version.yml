name: Version check

# Every PR into main must bump the shared workspace version in /Cargo.toml,
# and that version must differ from what main currently has.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare versions with main
        run: |
          set -euo pipefail

          # Prints the version from the given table of the Cargo.toml read on stdin.
          table_version() {
            awk -v table="[$1]" '/^\[/ { p = ($0 == table) }
                 p && /^version[[:space:]]*=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }'
          }

          pr_version=$(table_version workspace.package < Cargo.toml)
          if [ -z "$pr_version" ]; then
            echo "::error file=Cargo.toml::No [workspace.package] version found"
            exit 1
          fi
          echo "pr: ${pr_version}"

          git fetch --no-tags --depth=1 origin main
          main_version=$(git show origin/main:Cargo.toml | table_version workspace.package)
          if [ -z "$main_version" ]; then
            # main predates the workspace version; fall back to the client's own version
            main_version=$(git show origin/main:bins/terobit_client/Cargo.toml | table_version package)
          fi
          echo "main: ${main_version}"

          if [ "$pr_version" = "$main_version" ]; then
            echo "::error file=Cargo.toml::Version is still ${main_version}, same as main; bump [workspace.package] version"
            exit 1
          fi

          echo "Version ${main_version} -> ${pr_version}"
