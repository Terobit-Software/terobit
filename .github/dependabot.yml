version: 2
updates:
  # Rust dependencies (Cargo, workspace root)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily" # Options: daily, weekly, monthly
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    # Group minor/patch bumps into one PR to avoid PR fatigue; breaking
    # majors (wgpu, winit, ...) arrive as individual PRs instead.
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the actions used in CI workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
