version: 2
updates:
  # check cargo deps
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily" # options are daily, weekly, and monthly
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    # pin zstd version
    ignore:
      - dependency-name: "zstd"
      - dependency-name: "zstd-safe"
      - dependency-name: "zstd-sys"
    # group minor and pathces together
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # check the ci deps
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
