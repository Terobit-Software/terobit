version: 2
updates:
  # 1. Rust Dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly" # Options: daily, weekly, monthly
    # Group updates to avoid PR fatigue
    groups:
      rust-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"
