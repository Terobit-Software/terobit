[package]
name = "hello_world1"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
terobit_v1.workspace = true

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Development release builds: optimized, but compiles quickly and incrementally.
# cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
strip = false
debug = "line-tables-only"
panic = "unwind"
